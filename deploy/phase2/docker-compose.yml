name: shijiajing-phase2

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shijiajing}
      POSTGRES_USER: ${POSTGRES_USER:-shijiajing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${SHIJIAJING_POSTGRES_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - shijiajing_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.123.0}
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${SHIJIAJING_OTLP_HTTP_PUBLISHED_PORT:-4318}:4318"
      - "${SHIJIAJING_OTLP_GRPC_PUBLISHED_PORT:-4317}:4317"
    healthcheck:
      test:
        - CMD
        - /otelcol-contrib
        - validate
        - --config=/etc/otelcol-contrib/config.yaml
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  shijiajing_postgres_data:

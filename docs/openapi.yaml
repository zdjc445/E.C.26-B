openapi: 3.1.0
info:
  title: Smart Shopping Agent API
  version: 0.1.0
  description: 智能识物比价购物 AI APP 助手 API 契约。
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Images
  - name: Recognitions
  - name: SearchTasks
  - name: Products
  - name: Comparisons
  - name: AgentRecommendations
  - name: Favorites
  - name: PriceAlerts
  - name: Ecommerce

paths:
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: 用户注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: 刷新 Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'

  /auth/logout:
    post:
      tags: [Auth]
      security: []
      summary: 退出登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /auth/me:
    get:
      tags: [Auth]
      summary: 当前用户
      responses:
        '200':
          description: 当前用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /ecommerce/status:
    get:
      tags: [Ecommerce]
      security: []
      summary: 真实电商 API 配置状态
      description: 返回服务端是否启用 official_api 以及各平台适配器是否已配置，不返回任何密钥。
      responses:
        '200':
          description: 当前电商 API 配置状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcommerceStatusResponse'

  /ecommerce/diagnostics:
    get:
      tags: [Ecommerce]
      summary: 真实电商 API 调用诊断
      description: 使用已配置的平台密钥发起一次小页量商品查询，返回每个平台是否调用成功、耗时、结果数量和示例标题；平台 HTTP 200 业务错误会被识别为 failed，不返回任何密钥。
      parameters:
        - name: query
          in: query
          schema:
            type: string
            default: 吹风机
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 3
            minimum: 1
            maximum: 5
        - name: platforms
          in: query
          description: 可选平台过滤，支持 pdd、jd，可重复传参或使用逗号分隔。
          schema:
            type: array
            items:
              type: string
              enum: [pdd, jd]
          style: form
          explode: false
      responses:
        '200':
          description: 当前电商 API 调用诊断
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcommerceDiagnosticsResponse'

  /images:
    post:
      tags: [Images]
      summary: 上传图片
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                scene:
                  type: string
                  default: recognition
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
    get:
      tags: [Images]
      summary: 查询图片列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 图片列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagePageResponse'

  /images/{imageId}:
    delete:
      tags: [Images]
      summary: 删除图片
      parameters:
        - $ref: '#/components/parameters/ImageId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /recognitions:
    post:
      tags: [Recognitions]
      summary: 创建识别任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecognitionRequest'
      responses:
        '200':
          description: 识别结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognitionResponse'

  /recognitions/{recognitionId}:
    get:
      tags: [Recognitions]
      summary: 查询识别结果
      parameters:
        - $ref: '#/components/parameters/RecognitionId'
      responses:
        '200':
          description: 识别结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognitionResponse'

  /recognitions/{recognitionId}/attributes:
    patch:
      tags: [Recognitions]
      summary: 修正识别属性
      parameters:
        - $ref: '#/components/parameters/RecognitionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecognitionAttributesRequest'
      responses:
        '200':
          description: 修正后的识别结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognitionResponse'

  /search-tasks:
    post:
      tags: [SearchTasks]
      summary: 创建搜索任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSearchTaskRequest'
      responses:
        '200':
          description: 搜索任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchTaskResponse'
    get:
      tags: [SearchTasks]
      summary: 查询搜索历史
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 搜索历史
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchTaskSummaryPageResponse'

  /search-tasks/{searchTaskId}:
    get:
      tags: [SearchTasks]
      summary: 查询搜索任务详情
      parameters:
        - $ref: '#/components/parameters/SearchTaskId'
      responses:
        '200':
          description: 搜索任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchTaskResponse'

  /search-tasks/{searchTaskId}/refine:
    post:
      tags: [SearchTasks]
      summary: 自然语言追加筛选并刷新结果
      parameters:
        - $ref: '#/components/parameters/SearchTaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefineSearchTaskRequest'
      responses:
        '200':
          description: 追加筛选结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefineSearchTaskResponse'

  /products/{productId}:
    get:
      tags: [Products]
      summary: 查询标准商品详情
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: 标准商品详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'

  /platform-products/{platformProductId}:
    get:
      tags: [Products]
      summary: 查询平台商品详情
      parameters:
        - $ref: '#/components/parameters/PlatformProductId'
      responses:
        '200':
          description: 平台商品详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformProductResponse'

  /platform-products/{platformProductId}/price-history:
    get:
      tags: [Products]
      summary: 查询平台商品历史价格
      parameters:
        - $ref: '#/components/parameters/PlatformProductId'
        - name: days
          in: query
          schema:
            type: integer
            default: 90
            minimum: 1
      responses:
        '200':
          description: 历史价格
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceHistoryResponse'

  /platform-products/{platformProductId}/review-summary:
    get:
      tags: [Products]
      summary: 查询评价摘要
      parameters:
        - $ref: '#/components/parameters/PlatformProductId'
      responses:
        '200':
          description: 评价摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewSummaryResponse'

  /comparisons:
    post:
      tags: [Comparisons]
      summary: 创建比价
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComparisonRequest'
      responses:
        '200':
          description: 比价结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonResponse'

  /agent/recommendations:
    post:
      tags: [AgentRecommendations]
      summary: 创建购物推荐
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecommendationRequest'
      responses:
        '200':
          description: 推荐结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'

  /agent/recommendations/{recommendationId}:
    get:
      tags: [AgentRecommendations]
      summary: 查询推荐记录
      parameters:
        - $ref: '#/components/parameters/RecommendationId'
      responses:
        '200':
          description: 推荐记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'

  /favorites:
    post:
      tags: [Favorites]
      summary: 创建收藏
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFavoriteRequest'
      responses:
        '200':
          description: 收藏记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteResponse'
    get:
      tags: [Favorites]
      summary: 查询收藏列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 收藏列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoritePageResponse'

  /favorites/{favoriteId}:
    delete:
      tags: [Favorites]
      summary: 删除收藏
      parameters:
        - $ref: '#/components/parameters/FavoriteId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /price-alerts:
    post:
      tags: [PriceAlerts]
      summary: 创建价格提醒
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePriceAlertRequest'
      responses:
        '200':
          description: 价格提醒记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertResponse'
    get:
      tags: [PriceAlerts]
      summary: 查询价格提醒列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 价格提醒列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertPageResponse'

  /price-alerts/{priceAlertId}:
    patch:
      tags: [PriceAlerts]
      summary: 更新价格提醒
      parameters:
        - $ref: '#/components/parameters/PriceAlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePriceAlertRequest'
      responses:
        '200':
          description: 价格提醒记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertResponse'
    delete:
      tags: [PriceAlerts]
      summary: 删除价格提醒
      parameters:
        - $ref: '#/components/parameters/PriceAlertId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    ImageId:
      name: imageId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RecognitionId:
      name: recognitionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SearchTaskId:
      name: searchTaskId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PlatformProductId:
      name: platformProductId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RecommendationId:
      name: recommendationId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    FavoriteId:
      name: favoriteId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PriceAlertId:
      name: priceAlertId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  schemas:
    SourceType:
      type: string
      description: mock 为离线演示数据，official_api 为服务端调用授权电商开放平台 API 后归一化的数据。
      enum: [mock, official_api, sample_dataset]
    Platform:
      type: string
      enum: [jd, taobao, pdd, tmall, other]
    SortMode:
      type: string
      enum: [comprehensive, price_asc, sales_desc, rating_desc]
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          example: '199.00'
        currency:
          type: string
          example: CNY
    SuggestionCard:
      type: object
      required: [cardId, type, title, payload, priority]
      properties:
        cardId: { type: string }
        type: { type: string, enum: [filter, sort, price_history, similar, official] }
        title: { type: string }
        payload:
          type: object
          additionalProperties: true
        priority: { type: integer }
    PlatformStats:
      type: object
      required: [platform, lowestPrice, averagePrice, productCount]
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        lowestPrice:
          $ref: '#/components/schemas/Money'
        averagePrice:
          $ref: '#/components/schemas/Money'
        productCount: { type: integer }
    ApiMeta:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
    EmptyResponse:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              type: 'null'
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        password: { type: string, minLength: 8 }
        nickname: { type: string, nullable: true }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    User:
      type: object
      required: [id, username, status]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        status: { type: string, enum: [active, disabled] }
    AuthPayload:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 7200 }
        user:
          $ref: '#/components/schemas/User'
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuthPayload'
    RefreshTokenResponse:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              type: object
              required: [accessToken, refreshToken, expiresIn]
              properties:
                accessToken: { type: string }
                refreshToken: { type: string }
                expiresIn: { type: integer, example: 7200 }
    UserResponse:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'
    EcommerceProviderStatus:
      type: object
      required: [platform, enabled, configured, requiredConfig, missingConfig]
      properties:
        platform: { type: string, example: 拼多多 }
        enabled: { type: boolean }
        configured: { type: boolean }
        requiredConfig:
          type: array
          items: { type: string }
          example: [ECOMMERCE_API_ENABLED, PDD_API_ENABLED, PDD_CLIENT_ID, PDD_CLIENT_SECRET]
        missingConfig:
          type: array
          items: { type: string }
          example: [PDD_CLIENT_ID, PDD_CLIENT_SECRET]
    EcommerceStatus:
      type: object
      required: [enabled, hasConfiguredClient, providers]
      properties:
        enabled: { type: boolean }
        hasConfiguredClient: { type: boolean }
        providers:
          type: array
          items:
            $ref: '#/components/schemas/EcommerceProviderStatus'
    EcommerceStatusResponse:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EcommerceStatus'
    EcommerceProviderDiagnostic:
      type: object
      required: [platform, configured, success, status, itemCount, durationMs, sampleTitles, errorCode, errorMessage, missingConfig]
      properties:
        platform: { type: string, example: 拼多多 }
        configured: { type: boolean }
        success: { type: boolean }
        status:
          type: string
          enum: [ok, failed, not_configured]
        itemCount: { type: integer }
        durationMs: { type: integer, format: int64 }
        sampleTitles:
          type: array
          items: { type: string }
        errorCode:
          type: string
          description: 调用失败时的平台业务错误码，例如 PDD/JD 返回的权限或签名错误码。
        errorMessage:
          type: string
          description: 调用失败时的安全错误摘要，不包含密钥。
        missingConfig:
          type: array
          items: { type: string }
    EcommerceDiagnostics:
      type: object
      required: [query, checkedAt, providers]
      properties:
        query: { type: string }
        checkedAt: { type: string, format: date-time }
        providers:
          type: array
          items:
            $ref: '#/components/schemas/EcommerceProviderDiagnostic'
    EcommerceDiagnosticsResponse:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EcommerceDiagnostics'
    Image:
      type: object
      required: [imageId, imageUrl, contentType, createdAt]
      properties:
        imageId: { type: integer, format: int64 }
        imageUrl: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    ImageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Image'
    ImagePageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ImagePage'
    ImagePage:
      allOf:
        - $ref: '#/components/schemas/PageBase'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Image'
    CreateRecognitionRequest:
      type: object
      required: [imageId]
      properties:
        imageId: { type: integer, format: int64 }
    UpdateRecognitionAttributesRequest:
      type: object
      properties:
        category: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        attributes:
          type: object
          additionalProperties: true
    Recognition:
      type: object
      required: [recognitionId, imageId, category, keywords, confidence, status, createdAt]
      properties:
        recognitionId: { type: integer, format: int64 }
        imageId: { type: integer, format: int64 }
        category: { type: string }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        keywords:
          type: array
          items: { type: string }
        attributes:
          type: object
          additionalProperties: true
        suggestionCards:
          type: array
          items:
            $ref: '#/components/schemas/SuggestionCard'
        confidence: { type: number, format: double }
        aiProvider:
          type: string
          example: mock
        fallbackUsed:
          type: boolean
          description: Ark/VLM/LLM 不可用时是否已回退到 mock 或规则解析。
        explanation:
          type: string
          nullable: true
        notices:
          type: array
          items: { type: string }
        status: { type: string, enum: [pending, succeeded, failed] }
        createdAt: { type: string, format: date-time }
    RecognitionResponse:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Recognition'
    CreateSearchTaskRequest:
      type: object
      properties:
        recognitionId: { type: integer, format: int64, nullable: true }
        query: { type: string, nullable: true }
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/Platform'
        sourceType:
          $ref: '#/components/schemas/SourceType'
        filters:
          type: object
          additionalProperties: true
        sortBy:
          $ref: '#/components/schemas/SortMode'
    SearchTaskItem:
      type: object
      required: [platformProductId, productId, platform, title, price, matchScore, matchReasons, sourceType, tags, salesVolume, rating, isOfficial, isSelfOperated]
      properties:
        platformProductId: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        platform:
          $ref: '#/components/schemas/Platform'

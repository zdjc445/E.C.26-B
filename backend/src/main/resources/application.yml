server:
  port: 8080

spring:
  application:
    name: price-lens
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

app:
  upload-dir: ${UPLOAD_DIR:../uploads}
  persistence:
    store: ${APP_PERSISTENCE_STORE:memory}
  product-source:
    mode: ${PRODUCT_SOURCE_MODE:public-dataset-platforms}
    public-resource: ${PUBLIC_PRODUCT_RESOURCE:data/public-product-offers.json}
  ai:
    provider: ${AI_PROVIDER:mock}
    ark:
      api-key: ${ARK_API_KEY:}
      endpoint-id: ${ARK_ENDPOINT_ID:}
      base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
  auth:
    enabled: ${AUTH_ENABLED:false}
    jwt-secret: ${AUTH_JWT_SECRET:dev-only-256bit-secret-please-change-me-12345678}
    jwt-ttl-minutes: ${AUTH_JWT_TTL_MINUTES:1440}
  voice:
    provider: ${VOICE_PROVIDER:mock}
    transcript-fallback: ${VOICE_FALLBACK_TEXT:推荐运动鞋}

logging:
  level:
    root: INFO
    org.springframework: INFO

---
spring:
  config:
    activate:
      on-profile: postgres
  autoconfigure:
    exclude: []
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopping_agent}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  persistence:
    store: postgres
    enabled: true

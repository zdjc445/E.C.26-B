server:
  port: 8080

spring:
  application:
    name: shopping-agent
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-change-me-dev-only-change-me}
    access-token-seconds: 7200
  upload-dir: ${UPLOAD_DIR:uploads}
  mock-data-dir: ${MOCK_DATA_DIR:mock-data}
  ai:
    provider: ${AI_PROVIDER:mock}
    ark:
      api-key: ${ARK_API_KEY:}
      endpoint-id: ${ARK_ENDPOINT_ID:}
      base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}

---
spring:
  config:
    activate:
      on-profile: postgres
  flyway:
    enabled: true
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/shopping_agent}
    user: ${POSTGRES_USER:shopping_agent}
    password: ${POSTGRES_PASSWORD:shopping_agent}
  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/shopping_agent}
    username: ${POSTGRES_USER:shopping_agent}
    password: ${POSTGRES_PASSWORD:shopping_agent}

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4F46E5" />
    <title>E.C.26-B 购物决策工作台</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <button id="sidePanelToggle" class="drawer-toggle" type="button" aria-expanded="false">操作</button>
      <aside class="side-panel">
        <div class="brand-block">
          <div class="brand-mark">EC</div>
          <div>
            <h1>E.C.26-B</h1>
            <p>购物决策工作台</p>
          </div>
        </div>

        <section class="panel auth-panel">
          <div class="section-title">
            <span>账号</span>
            <span id="authStatus" class="status-pill">未登录</span>
          </div>
          <label>
            用户名
            <input id="username" value="alice" autocomplete="username" />
          </label>
          <label>
            密码
            <input id="password" value="password123" type="password" autocomplete="current-password" />
          </label>
          <label>
            昵称
            <input id="nickname" value="Alice" />
          </label>
          <div class="button-row">
            <button id="registerBtn" class="primary">注册</button>
            <button id="loginBtn">登录</button>
          </div>
        </section>

        <section class="panel capture-panel">
          <div class="section-title">
            <span>图片</span>
            <button id="demoImageBtn" class="ghost">示例图</button>
          </div>
          <label>
            演示场景
            <select id="demoScenario">
              <option value="hair-dryer">宿舍吹风机</option>
              <option value="headphones">主动降噪耳机</option>
              <option value="phone">5G 智能手机</option>
              <option value="keyboard">机械键盘</option>
              <option value="cup">保温水杯</option>
              <option value="running-shoes">缓震运动鞋</option>
              <option value="skincare">敏感肌护肤乳</option>
            </select>
          </label>
          <label class="upload-target">
            <input id="imageInput" type="file" accept="image/*" capture="environment" />
            <span>选择或拍摄商品图</span>
          </label>
          <div class="camera-actions">
            <button id="startCameraBtn" type="button">打开相机</button>
            <button id="capturePhotoBtn" type="button">拍照</button>
            <button id="stopCameraBtn" type="button">关闭</button>
          </div>
          <video id="cameraVideo" playsinline muted></video>
          <img id="previewImage" alt="商品预览" />
          <button id="analyzeBtn" class="primary wide">上传并识别</button>
          <button id="demoFlowBtn" class="wide" type="button">一键演示主链路</button>
        </section>

        <section class="panel demo-panel">
          <div class="section-title">
            <span>主链路进度</span>
            <span id="demoStatus" class="status-pill">待启动</span>
          </div>
          <div id="demoTimeline" class="demo-timeline"></div>
        </section>

        <section class="panel">
          <div class="section-title">
            <span>追加筛选</span>
          </div>
          <textarea id="refineText">1000 元以内的黑色款，要评价 4.8 分以上，只看官方</textarea>
          <div class="sort-tabs" role="tablist" aria-label="排序">
            <button data-sort="comprehensive" class="active">综合</button>
            <button data-sort="price_asc">低价</button>
            <button data-sort="sales_desc">销量</button>
            <button data-sort="rating_desc">好评</button>
          </div>
          <button id="refineBtn" class="primary wide">刷新推荐</button>
        </section>

        <section class="panel asset-panel">
          <div class="section-title">
            <span>购物资产</span>
          </div>
          <div class="button-row">
            <button id="loadFavoritesBtn" type="button">收藏</button>
            <button id="loadAlertsBtn" type="button">提醒</button>
          </div>
          <div id="assetsBox" class="assets-box empty" hidden></div>
        </section>

        <section class="panel history-panel">
          <div class="section-title">
            <span>历史工作台</span>
            <span id="historyStatus" class="status-pill">未加载</span>
          </div>
          <div class="button-row">
            <button id="loadHistoryBtn" type="button">搜索</button>
            <button id="loadImagesBtn" type="button">图片</button>
          </div>
          <div id="historyBox" class="history-box empty" hidden></div>
        </section>
      </aside>

      <section class="workspace">
        <div class="top-bar">
          <label>
            API
            <input id="apiBase" value="http://localhost:8080/api" />
          </label>
          <label>
            数据源
            <select id="sourceType">
              <option value="mock">演示数据集</option>
              <option value="official_api">官方 API</option>
            </select>
          </label>
          <label>
            平台
            <select id="platformFilter">
              <option value="">全部</option>
              <option value="pdd">拼多多</option>
              <option value="jd">京东</option>
            </select>
          </label>
          <div class="status-field">
            <span>官方 API</span>
            <span id="ecommerceStatus" class="status-pill">未检测</span>
          </div>
          <button id="ecommerceCheckBtn">诊断</button>
          <button id="loadMeBtn">当前用户</button>
        </div>

        <section id="decisionBrief" class="brief-band empty" hidden>
          <div class="brief-main">
            <span>决策摘要</span>
            <strong>等待识别与候选商品</strong>
            <p>尚未生成购物决策</p>
          </div>
          <div class="brief-metrics">
            <div><span>候选</span><strong>-</strong></div>
            <div><span>最低价</span><strong>-</strong></div>
            <div><span>决策分</span><strong>-</strong></div>
            <div><span>风险</span><strong>-</strong></div>
          </div>
          <div class="brief-actions">
            <button id="copyBriefBtn" type="button">复制摘要</button>
            <button id="copyReportBtn" type="button" disabled>复制报告</button>
          </div>
        </section>

        <section class="result-band" hidden>
          <div>
            <h2>识别结果</h2>
            <div id="recognitionBox" class="recognition-box empty">等待识别</div>
          </div>
          <div>
            <h2>建议卡片</h2>
            <div id="suggestionCards" class="suggestion-grid"></div>
          </div>
        </section>

        <section class="stats-band" hidden>
          <div>
            <h2>平台统计</h2>
            <div id="platformStats" class="stats-grid"></div>
          </div>
          <div>
            <h2>Agent 决策中枢</h2>
            <div id="recommendationBox" class="recommendation-box empty">等待生成</div>
          </div>
        </section>

        <section class="toolbar" hidden>
          <div>
            <strong id="resultCount">0</strong>
            <span>个候选商品</span>
          </div>
          <div class="button-row">
            <button id="compareBtn">生成比价</button>
            <button id="recommendBtn" class="primary">生成推荐</button>
          </div>
        </section>

        <section class="comparison-section" hidden>
          <h2>商品对比</h2>
          <div id="comparisonBox" class="comparison-box empty">勾选 2-4 个商品后生成对比</div>
        </section>

        <section class="insight-section" hidden>
          <h2>商品洞察</h2>
          <div id="insightBox" class="insight-box empty">等待分析</div>
        </section>

        <section id="productGrid" class="product-grid" hidden></section>
      </section>
    </main>

    <div id="toast" class="toast"></div>
    <script src="./app.js" type="module"></script>
  </body>
</html>
